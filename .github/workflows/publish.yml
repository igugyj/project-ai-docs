name: publish

# 手动触发（Actions 页 → Run workflow）。发布 package.json 当前 version：
# 先在本地把版本改好（npm version x.y.z 或手改 package.json）→ 提交 → 触发。
# 前置：仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN
#（npm 账号 access token，权限：Read and publish 或 full）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 读取版本
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 发布前查重：该版本已在 npm 上 → 中止（防重复发布 403；包名取 package.json）
      - name: 校验版本未发布
        run: |
          PKG=$(node -p "require('./package.json').name")
          if npm view "${PKG}@${{ steps.version.outputs.VERSION }}" version >/dev/null 2>&1; then
            echo "version ${{ steps.version.outputs.VERSION }} already published; bump package.json locally first" >&2
            exit 1
          fi

      # 校验发布内容（files 白名单生效：skills/extensions/patch/README*/LICENSE）
      - name: 校验发布包内容
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 补 tag 并推回（GITHUB_TOKEN）
      - name: 打 tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push origin "v${VERSION}"